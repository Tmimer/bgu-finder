<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כיתה פנויה</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F26B1D">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f6f3ef; --card: #ffffff; --ink: #1d1a17; --muted: #7a7168;
    --line: #e6dfd6; --accent: #f26b1d; --accent-ink: #ffffff; --good: #1f8a4c;
    --chip: #fbeee4; --chip-ink: #b4470b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151210; --card: #211d1a; --ink: #f3ede6; --muted: #a39a90;
      --line: #342e29; --accent: #ff8a45; --accent-ink: #1a0f08; --good: #5fd28d;
      --chip: #3a2a20; --chip-ink: #ffb98a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.3px; }
  #today { color: var(--muted); font-size: 14px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 2px 4px; }
  select, input[type=time] {
    width: 100%; height: 44px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 0 10px;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #go {
    width: auto;
    height: 32px;
    padding: 0 12px;
    margin: 0;
    border: 1px solid var(--border, rgba(128, 128, 128, 0.35));
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: none;
    opacity: 0.8;
  }
  #go:hover, #go:active {
    opacity: 1;
    background: rgba(128, 128, 128, 0.1);
  }
  #summary { color: var(--muted); font-size: 14px; margin: 10px 4px 8px; min-height: 20px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .room { font-size: 19px; font-weight: 700; }
  .room small { font-size: 13px; font-weight: 500; color: var(--muted); margin-inline-start: 6px; }
  .until { font-size: 14px; color: var(--good); margin-top: 2px; }
  .chip { background: var(--chip); color: var(--chip-ink); border-radius: 999px; padding: 4px 10px;
    font-size: 13px; white-space: nowrap; }
  #more { width: 100%; height: 44px; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px;
    background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 6px 0; }
  [hidden] { display: none !important; }
  bdi { unicode-bidi: isolate; }
</style>
</head>
<body>
  <header>
    <h1>כיתה פנויה</h1>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span id="today"></span>
      <button id="go" type="button">איפוס לעכשיו ↺</button>
    </div>
  </header>

  <section class="panel">
    <div class="grid">
      <div><label for="building">בניין</label><select id="building"></select></div>
      <div><label for="day">יום</label><select id="day"></select></div>
      <div><label for="start">משעה</label><input id="start" type="time"></div>
      <div><label for="end">עד שעה</label><input id="end" type="time"></div>
    </div>
    <div class="seg" role="group" aria-label="מיון">
      <button id="s-nearest" aria-pressed="true">הכי קרובות</button>
      <button id="s-longest" aria-pressed="false">הכי הרבה זמן</button>
    </div>
  </section>

  <div id="summary"></div>
  <ul id="list"></ul>
  <button id="more" hidden>הצג עוד</button>

  <footer>לפי מערכת השעות הרשמית. בחינות, שיעורי השלמה ואירועים לא מופיעים, אז ייתכן שכיתה "פנויה" בפועל תפוסה.</footer>

  <script src="vendor/sql-wasm.js"></script>
  <script src="finder.js"></script>
  <script src="app.js"></script>
</body>
</html>
